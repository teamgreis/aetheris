name: Build iOS (SwiftUI)

on:
  push:
    branches: [main, develop]
    paths:
      - 'Aetheris Mobile/**'
      - 'Shared/Aetheris.Schema/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Aetheris Mobile/**'
      - 'Shared/Aetheris.Schema/**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install Swift dependencies
        run: |
          cd Aetheris Mobile/AetherisMobile
          # Swift Package Manager will resolve automatically

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project AetherisMobile.xcodeproj \
            -scheme AetherisMobile \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run tests
        run: |
          xcodebuild test \
            -project AetherisMobile.xcodeproj \
            -scheme AetherisMobile \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Check signing configuration
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for device (archive)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        run: |
          xcodebuild archive \
            -project AetherisMobile.xcodeproj \
            -scheme AetherisMobile \
            -archivePath $PWD/build/AetherisMobile.xcarchive \
            -configuration Release \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $PWD/build/AetherisMobile.xcarchive \
            -exportPath $PWD/build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-mobile-ipa
          path: build/ipa/*.ipa
          retention-days: 30