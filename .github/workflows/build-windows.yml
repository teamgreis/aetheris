name: Build Windows (WinUI 3)

on:
  push:
    branches: [main, develop]
    paths:
      - 'Aetheris Studio/**'
      - 'Shared/Aetheris.Schema/**'
      - 'Aetheris.sln'
      - 'global.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Aetheris Studio/**'
      - 'Shared/Aetheris.Schema/**'
      - 'Aetheris.sln'

env:
  SOLUTION_FILE: Aetheris.sln
  CONFIGURATION: Release
  PLATFORM: x64
  RID: win-x64

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: false

      # MSBuild.exe is required for MSIX packaging (dotnet publish cannot
      # run the WinAppSDK packaging tasks)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and test schema
        run: |
          cd ${{ github.workspace }}
          dotnet test "Shared/Aetheris.Schema.Tests/Aetheris.Schema.Tests.csproj" --configuration ${{ env.CONFIGURATION }} -p:Platform=${{ env.PLATFORM }} --logger "trx;LogFileName=schema-tests.trx"

      - name: Build and test studio (full chain incl. WinUI 3 UI)
        run: |
          cd ${{ github.workspace }}
          dotnet test "Aetheris Studio/src/Aetheris.Studio.Tests/Aetheris.Studio.Tests.csproj" --configuration ${{ env.CONFIGURATION }} -p:Platform=${{ env.PLATFORM }} --logger "trx;LogFileName=studio-tests.trx"

      - name: Restore for MSIX packaging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ${{ github.workspace }}
          msbuild "Aetheris Studio/src/Aetheris.Studio/Aetheris.Studio.csproj" /t:Restore /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }}

      - name: Create self-contained MSIX package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ${{ github.workspace }}
          msbuild "Aetheris Studio/src/Aetheris.Studio/Aetheris.Studio.csproj" `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:Platform=${{ env.PLATFORM }} `
            /p:RuntimeIdentifier=${{ env.RID }} `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxPackageDir="${{ github.workspace }}/artifacts/" `
            /p:GenerateAppxPackageOnBuild=true

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-studio-msix
          path: artifacts/**/*.msix
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: '**/*.trx'
          retention-days: 7
          if-no-files-found: warn

      - name: Upload XAML diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xaml-diagnostics
          path: |
            Aetheris Studio/src/Aetheris.Studio/obj/**/win-x64/output.json
          retention-days: 7
          if-no-files-found: warn
