name: Build Windows (WinUI 3)

on:
  push:
    branches: [main, develop]
    paths:
      - 'Aetheris Studio/**'
      - 'Shared/Aetheris.Schema/**'
      - 'Aetheris.sln'
      - 'global.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Aetheris Studio/**'
      - 'Shared/Aetheris.Schema/**'
      - 'Aetheris.sln'
  workflow_dispatch:

env:
  SOLUTION_FILE: Aetheris.sln
  CONFIGURATION: Release
  PLATFORM: x64
  RID: win-x64

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: false

      - name: Build and test schema
        run: |
          cd ${{ github.workspace }}
          dotnet test "Shared/Aetheris.Schema.Tests/Aetheris.Schema.Tests.csproj" --configuration ${{ env.CONFIGURATION }} -p:Platform=${{ env.PLATFORM }} --logger "trx;LogFileName=schema-tests.trx"

      - name: Build and test studio (full chain incl. WinUI 3 UI)
        run: |
          cd ${{ github.workspace }}
          dotnet test "Aetheris Studio/src/Aetheris.Studio.Tests/Aetheris.Studio.Tests.csproj" --configuration ${{ env.CONFIGURATION }} -p:Platform=${{ env.PLATFORM }} --logger "trx;LogFileName=studio-tests.trx"

      - name: Publish WinUI 3 app (MSIX)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ${{ github.workspace }}
          dotnet publish "Aetheris Studio/src/Aetheris.Studio/Aetheris.Studio.csproj" `
            --configuration ${{ env.CONFIGURATION }} `
            --runtime ${{ env.RID }} `
            --self-contained true `
            -p:AppxPackageDir="$(pwd)/artifacts/" `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=CI `
            -p:AppxPackageSigningEnabled=false `
            -p:Platform=${{ env.PLATFORM }}

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-studio-msix
          path: artifacts/**/*.msix
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: '**/*.trx'
          retention-days: 7
          if-no-files-found: warn

      - name: Upload XAML diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xaml-diagnostics
          path: |
            Aetheris Studio/src/Aetheris.Studio/obj/**/win-x64/output.json
          retention-days: 7
          if-no-files-found: warn
